<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🎓 Öğrenci Dashboard | ClassConnect</title>
  <script src="../js/head_loader.js" defer></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100">

  <!-- Navbar yükleme alanı -->
  <div id="navbar-placeholder"></div>
<script src="../js/navbar_loader.js"></script>

  <main class="flex-fill">
    <div class="container my-5">

      <div class="text-center mb-4">
        <h2 class="m-0">🎓 Öğrenci Paneli</h2>
        <div class="mt-3">
          <button id="joinLiveLesson" class="btn btn-info btn-lg">🔵 Canlı Derse Katıl</button>
        </div>
      </div>

      <div class="row g-4 d-flex justify-content-center">
        <div class="col-md-6">
          <div class="card mb-4">
            <div class="card-header bg-info text-white">⏳ Onay Bekleyen Derslerim</div>
            <ul class="list-group list-group-flush" id="pendingLessonsList">
              <li class="list-group-item text-muted">Yükleniyor...</li>
            </ul>
          </div>

          <div class="card mb-4">
            <div class="card-header bg-warning">🗓️ Bugünkü Dersler</div>
            <ul class="list-group list-group-flush" id="todayLessonsList">
              <li class="list-group-item text-muted">Henüz bugüne özel ders yok.</li>
            </ul>
          </div>

          <div class="card">
            <div class="card-header bg-success text-white">🔄 Aktif Randevularım</div>
            <ul class="list-group list-group-flush" id="activeLessonsList">
              <li class="list-group-item text-muted">Devam eden ders yok.</li>
            </ul>
          </div>
        </div>
      </div>

    </div>
  </main>

  <footer id="footer-placeholder" class="mt-auto">
    <script src="../js/footer_loader.js"></script>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    function formatDate(d) {
      return new Date(d).toLocaleDateString('tr-TR', {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
      });
    }
    function stripSec(t) {
      return t.replace(/:00$/, '');
    }

    async function cancelLesson(id) {
      if (!confirm('Bu randevuyu iptal etmek istediğinize emin misiniz?')) return;
      try {
        const res = await fetch(`/api/appointments/${id}/cancel`, {
          method: 'PATCH', credentials: 'include'
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.message);
        loadStudentAppointments();
      } catch (e) {
        alert('İptal edilemedi: ' + e.message);
      }
    }

    async function loadStudentAppointments() {
      const pendEl = document.getElementById('pendingLessonsList');
      const todayEl = document.getElementById('todayLessonsList');
      const actEl = document.getElementById('activeLessonsList');
      const today = new Date().toISOString().split('T')[0];

      [pendEl, todayEl, actEl].forEach(el => el.innerHTML = '');

      try {
        const [pendRes, confRes] = await Promise.all([
          fetch('/api/appointments/student/pending', { credentials: 'include' }).then(r => r.json()),
          fetch('/api/appointments/student/confirmed', { credentials: 'include' }).then(r => r.json())
        ]);

        if (pendRes.success && pendRes.appointments.length) {
          pendRes.appointments.forEach(a => {
            pendEl.insertAdjacentHTML('beforeend', `
              <li class="list-group-item d-flex justify-content-between align-items-start flex-wrap">
                <div>
                  <strong>${formatDate(a.appointment_date)}, ${stripSec(a.start_time)} – ${stripSec(a.end_time)}</strong><br>
                  <small>${a.lesson} | ${a.teacher_name}</small>
                </div>
                <button class="btn btn-sm btn-danger" onclick="cancelLesson(${a.id})">İptal Et</button>
              </li>`);
          });
        } else {
          pendEl.innerHTML = '<li class="list-group-item text-muted">Henüz onay bekleyen ders yok.</li>';
        }

        const allConfirmed = confRes.appointments || [];
        const todayApps = allConfirmed.filter(a => {
          const d = new Date(a.appointment_date);
          const localYMD = new Date(d.getTime() - d.getTimezoneOffset() * 60000)
            .toISOString().split('T')[0];
          return localYMD === today;
        });
        if (todayApps.length) {
          todayApps.forEach(a => {
            todayEl.insertAdjacentHTML('beforeend', `
              <li class="list-group-item">
                <strong>${formatDate(a.appointment_date)}, ${stripSec(a.start_time)} – ${stripSec(a.end_time)}</strong><br>
                <small>${a.lesson} | ${a.teacher_name}</small>
              </li>`);
          });
        }
        if (!todayEl.hasChildNodes()) {
          todayEl.innerHTML = '<li class="list-group-item text-muted">Henüz bugüne özel ders yok.</li>';
        }

        const upcoming = allConfirmed.filter(a => {
          const d = new Date(a.appointment_date);
          const localYMD = new Date(d.getTime() - d.getTimezoneOffset() * 60000)
            .toISOString().split('T')[0];
          return localYMD !== today;
        });
        if (upcoming.length) {
          upcoming.forEach(a => {
            actEl.insertAdjacentHTML('beforeend', `
              <li class="list-group-item d-flex justify-content-between align-items-center">
                <div>
                  <strong>${formatDate(a.appointment_date)}, ${stripSec(a.start_time)} – ${stripSec(a.end_time)}</strong><br>
                  <small>${a.lesson} | ${a.teacher_name}</small>
                </div>
                <button class="btn btn-sm btn-danger" onclick="cancelLesson(${a.id})">İptal Et</button>
              </li>`);
          });
        }
        if (!actEl.hasChildNodes()) {
          actEl.innerHTML = '<li class="list-group-item text-muted">Devam eden ders yok.</li>';
        }
      } catch (err) {
        console.error('Randevular yüklenemedi', err);
        [pendEl, todayEl, actEl].forEach(el =>
          el.innerHTML = '<li class="list-group-item text-danger">Sunucu hatası</li>'
        );
      }
    }

    document.addEventListener('DOMContentLoaded', loadStudentAppointments);

    document.getElementById("joinLiveLesson").addEventListener("click", async () => {
      try {
        const res = await fetch("/api/live-session/today", { credentials: 'include' });
        const data = await res.json();
        if (data.success && data.session_id) {
          window.location.href = `/pages/live_session_student.html?session=${data.session_id}`;
        } else {
          alert("Bugün için canlı ders oturumu bulunamadı.");
        }
      } catch (err) {
        console.error("Canlı derse yönlendirme hatası:", err);
        alert("Sunucu hatası: canlı ders oturumu alınamadı.");
      }
    });
  </script>
</body>

</html>
