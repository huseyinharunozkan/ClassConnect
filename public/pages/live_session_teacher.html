<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Canlı Ders Takibi | ClassConnect</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    body {
      background-color: #f4f8f9;
      font-family: Arial, sans-serif;
    }

    .lesson-box {
      max-width: 600px;
      margin: 50px auto;
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .lesson-logo {
      width: 90px;
      margin-bottom: 20px;
    }

    #timer {
      font-size: 32px;
      color: #007bff;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <div class="lesson-box">
    <img src="/media/logo.png" class="lesson-logo" alt="ClassConnect Logo">

    <h2>📚 Canlı Ders Takibi</h2>
    <p><strong>👨‍🎓 Öğrenci:</strong> <span id="studentName">–</span></p>
    <p><strong>👩‍🏫 Öğretmen:</strong> <span id="teacherName">–</span></p>
    <p><strong>📘 Ders:</strong> <span id="subjectName">–</span></p>

    <div class="mt-4" id="buttonArea">
        <!-- Başlangıçta sadece Eve Girdim butonu var -->
        <button class="btn btn-primary w-100 my-2" id="enterHomeBtn">🏠 Eve Girdim</button>
      </div>
      
      <p class="mt-4"><small>⏱️ Geçen Süre:</small></p>
      <div id="timer">00:00</div>
      
  </div>


<!-- Acil Durum Butonu -->
<div class="text-center mt-5">
  <br>
  <button class="btn btn-outline-danger" onclick="window.location.href='tel:112';">🚨 Acil Durum (112)</button>
</div>
<script>
let seconds = 0;
let timerInterval = null;
let exitConfirmed = false;
const sessionId = new URLSearchParams(window.location.search).get("session");
const timerDisplay = document.getElementById("timer");
const buttonArea = document.getElementById("buttonArea");

if (!sessionId) {
  alert("Geçersiz canlı ders bağlantısı.");
  window.location.href = "/pages/teacher_dashboard.html";
}

  loadSessionInfo(); // sayfa açıldığında bilgileri getir

async function loadSessionInfo() {
  try {
    const res = await fetch(`/api/live-session/${sessionId}/info`);
    const data = await res.json();
    if (data.success) {
      document.getElementById("studentName").textContent = data.student_name;
      document.getElementById("teacherName").textContent = data.teacher_name;
      document.getElementById("subjectName").textContent = data.lesson_name;
    } else {
      console.warn("Canlı ders bilgisi bulunamadı.");
    }
  } catch (err) {
    console.error("Canlı ders info hatası:", err);
  }
}


  setInterval(checkStudentStatus, 5000);

  async function checkStudentStatus() {
    try {
      const res = await fetch(`/api/live-session/${sessionId}/status`);
      const { session } = await res.json();

      if (!session.teacher_entered_home) {
        showEnterHomeButton();

      } else if (session.teacher_entered_home && !session.student_entered_home) {
        buttonArea.innerHTML = `<p class="text-muted">👨‍🎓 Öğrencinin onayı bekleniyor...</p>`;

      } else if (!session.teacher_ready) {
        showReadyButton();

      } else if (session.teacher_ready && !session.student_ready) {
        buttonArea.innerHTML = `<p class="text-muted">👨‍🎓 Öğrencinin hazır olması bekleniyor...</p>`;

      } else if (!session.teacher_confirm_started) {
        showStartLessonButton();

      } else if (session.teacher_confirm_started && !session.student_confirm_started) {
        buttonArea.innerHTML = `<p class="text-muted">👨‍🎓 Öğrencinin ders başlangıcı onayı bekleniyor...</p>`;

      } else if (
        session.teacher_confirm_started &&
        session.student_confirm_started &&
        !timerInterval
      ) {
        startTimer();
        showEndLessonButton();

      } else if (session.teacher_confirm_ended && !session.student_confirm_ended) {
        buttonArea.innerHTML = `<p class="text-muted">👨‍🎓 Öğrencinin ders bitişi onayı bekleniyor...</p>`;

      } else if (
        session.teacher_confirm_ended &&
        session.student_confirm_ended &&
        !session.teacher_confirm_exit &&
        !exitConfirmed
      ) {
        stopTimer();
        showExitButton(); // sadece bir kere gösterilir

      } else if (
        session.teacher_confirm_exit &&
        !session.student_confirm_exit
      ) {
        buttonArea.innerHTML = `<p class="text-muted">👨‍🎓 Öğrencinin çıkış onayı bekleniyor...</p>`;

      } else if (
        session.teacher_confirm_exit &&
        session.student_confirm_exit
      ) {
        buttonArea.innerHTML = `<p class="text-success">✅ Ders ve çıkış tamamlandı!</p>`;
      }

    } catch (err) {
      console.error("Durum kontrol hatası:", err);
    }
  }

  function showEnterHomeButton() {
    buttonArea.innerHTML = `
      <button class="btn btn-primary w-100 my-2" id="enterHomeBtn">🏠 Eve Girdim</button>
    `;
    document.getElementById("enterHomeBtn").addEventListener("click", async () => {
      await fetch(`/api/live-session/${sessionId}/teacher-entered`, { method: 'POST' });
      buttonArea.innerHTML = `<p class="text-muted">👨‍🎓 Öğrencinin onayı bekleniyor...</p>`;
    });
  }

  function showReadyButton() {
    buttonArea.innerHTML = `
      <button class="btn btn-success w-100 my-2" id="readyBtn">✅ Derse Hazırım</button>
    `;
    document.getElementById("readyBtn").addEventListener("click", async () => {
      await fetch(`/api/live-session/${sessionId}/teacher-ready`, { method: 'POST' });
      buttonArea.innerHTML = `<p class="text-muted">👨‍🎓 Öğrencinin hazır olması bekleniyor...</p>`;
    });
  }

  function showStartLessonButton() {
    buttonArea.innerHTML = `
      <button class="btn btn-info w-100 my-2" id="startLessonBtn">🚀 Ders Başladı</button>
    `;
    document.getElementById("startLessonBtn").addEventListener("click", async () => {
      await fetch(`/api/live-session/${sessionId}/teacher-start`, { method: 'POST' });
      buttonArea.innerHTML = `<p class="text-muted">👨‍🎓 Öğrencinin ders başlangıcı onayı bekleniyor...</p>`;
    });
  }

  function showEndLessonButton() {
    buttonArea.innerHTML = `
      <button class="btn btn-warning w-100 my-2" id="endLessonBtn">🛑 Ders Bitti</button>
    `;
    document.getElementById("endLessonBtn").addEventListener("click", async () => {
      await fetch(`/api/live-session/${sessionId}/teacher-end`, { method: 'POST' });
      buttonArea.innerHTML = `<p class="text-muted">👨‍🎓 Öğrencinin ders bitişi onayı bekleniyor...</p>`;
    });
  }

  function showExitButton() {
    if (exitConfirmed) return; // tekrar gösterilmesin
    buttonArea.innerHTML = `
      <button class="btn btn-secondary w-100 my-2" id="exitBtn">🚶‍♂️ Evden Çıktım</button>
    `;
    document.getElementById("exitBtn").addEventListener("click", async () => {
      await fetch(`/api/live-session/${sessionId}/teacher-exit-confirm`, { method: 'POST' });
      exitConfirmed = true; // buton tekrar gelmesin
      buttonArea.innerHTML = `<p class="text-muted">👨‍🎓 Öğrencinin çıkış onayı bekleniyor...</p>`;
    });
  }

  function startTimer() {
    timerInterval = setInterval(() => {
      seconds++;
      const m = Math.floor(seconds / 60).toString().padStart(2, '0');
      const s = (seconds % 60).toString().padStart(2, '0');
      timerDisplay.textContent = `${m}:${s}`;
    }, 1000);
  }

  function stopTimer() {
    clearInterval(timerInterval);
  }


      
</script>

 
    
</body>
</html>
