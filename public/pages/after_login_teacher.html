<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eğitmen Profilini Düzenle | ClassConnect</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link href="../css/main.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js" defer></script>
  <style>
    .profile-card {
      border-radius: 12px;
      overflow: hidden;
    }

    .profile-photo {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .upload-btn {
      position: absolute;
      bottom: -8px;
      right: -8px;
      background: var(--primary);
      color: #fff;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .availability-slot {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .availability-slot .form-control {
      max-width: 120px;
    }
  </style>
</head>

<body>
  <div id="navbar-placeholder"></div>
  <script src="../js/navbar_loader.js"></script>

  <section class="container my-5" data-gsap="fade-up">
    <div class="card profile-card shadow-lg">
      <div class="card-body p-4">
        <form id="editForm" enctype="multipart/form-data">
          <div class="d-flex align-items-center mb-4">
            <div class="position-relative me-4">
              <img id="photoPreview" src="/media/default.png" alt="Profil Fotoğrafı" class="profile-photo" />
              <label class="upload-btn">
                <i class="fas fa-camera"></i>
                <input type="file" id="photoInput" name="profile_photo" accept="image/*"
                  style="opacity:0; width:100%; height:100%; position:absolute; top:0; left:0; cursor:pointer;">
              </label>
            </div>
            <div>
              <h4 id="teacherName">Öğretmen Adı</h4>
              <p class="text-muted" id="teacherEmail">youremail@domain.com</p>
            </div>
          </div>
          <hr>

          <div class="mb-4">
            <h5 class="fw-semibold">Dersler ve Saatlik Ücret</h5>
            <div class="row">
              <div class="col-lg-8" id="subjectsList"></div>
              <div class="col-lg-4" id="priceFields"></div>
            </div>
          </div>

          <div class="mb-4">
            <h5 class="fw-semibold">Haftalık Müsaitlik</h5>
            <div class="alert alert-info" role="alert" style="font-size:0.9rem;">
              Seçtiğiniz gün ve saatler öğrenciler tarafından sadece <b>4 hafta (30 gün)</b> içindeki tarihler için
              rezerve edilebilir.
            </div>
            <div class="row" id="availabilityFields"></div>
          </div>

          <div class="text-center">
            <button type="submit" class="btn btn-primary">Kaydet</button>
          </div>
        </form>
      </div>
    </div>
  </section>

  <footer id="footer-placeholder"></footer>
  <script src="../js/footer_loader.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>

  <script>
    const subjects = {
      math: "Matematik", science: "Fen Bilimleri", turkish: "Türkçe",
      english: "İngilizce", social: "Sosyal Bilgiler", geography: "Coğrafya"
    };
    const daysOfWeek = ["Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi", "Pazar"];

    const toMins = hm => {
      const [h, m] = hm.split(':').map(Number);
      return h * 60 + m;
    };

    document.getElementById('photoInput').addEventListener('change', e => {
      const file = e.target.files[0];
      if (file) document.getElementById('photoPreview').src = URL.createObjectURL(file);
    });

    function renderSubjectCheckboxes() {
      const c = document.getElementById('subjectsList'); c.innerHTML = '';
      Object.entries(subjects).forEach(([key, label]) => {
        c.insertAdjacentHTML('beforeend', `
          <div class="form-check col-6 mb-2">
            <input class="form-check-input subject-check" type="checkbox" id="${key}">
            <label class="form-check-label" for="${key}">${label}</label>
          </div>`);
      });

      document.querySelectorAll('.subject-check').forEach(cb => cb.addEventListener('change', () => {
        const p = document.getElementById('priceFields'), saved = {};
        p.querySelectorAll('input').forEach(i => saved[i.dataset.subj] = i.value);
        p.innerHTML = '';
        document.querySelectorAll('.subject-check:checked').forEach(chk => {
          const id = chk.id, lab = subjects[id], val = saved[id] || '';
          p.insertAdjacentHTML('beforeend', `
            <div class="mb-3">
              <label class="form-label">${lab} - Saatlik Ücret (₺)</label>
              <input type="number" class="form-control" data-subj="${id}" id="price-${id}" value="${val}" required>
            </div>`);
        });
      }));
    }

    function renderAvailability() {
      const c = document.getElementById('availabilityFields'); c.innerHTML = '';
      daysOfWeek.forEach((day, idx) => {
        c.insertAdjacentHTML('beforeend', `
          <div class="col-md-4 mb-3">
            <div class="form-check mb-2">
              <input class="form-check-input dayChk" type="checkbox" id="day-${idx}">
              <label for="day-${idx}" class="form-check-label fw-medium">${day}</label>
            </div>
            <div class="availability-group" id="slotGroup-${idx}"></div>
            <button type="button" class="btn btn-link btn-sm" onclick="addSlot(${idx})">Saat Aralığı Ekle</button>
          </div>`);
      });

      document.querySelectorAll('.dayChk').forEach(chk => chk.addEventListener('change', e => {
        const idx = e.target.id.split('-')[1];
        document.querySelectorAll(`#slotGroup-${idx} input`).forEach(i => i.disabled = !e.target.checked);
      }));
    }

    function addSlot(dayIdx) {
      const grp = document.getElementById(`slotGroup-${dayIdx}`);
      const slot = document.createElement('div');
      slot.className = 'availability-slot';
      const disabled = !document.getElementById(`day-${dayIdx}`).checked ? 'disabled' : '';
      slot.innerHTML = `
        <input type="time" class="form-control form-control-sm start-time" ${disabled}>
        <span>—</span>
        <input type="time" class="form-control form-control-sm end-time" ${disabled}>
        <button type="button" class="btn btn-sm btn-outline-danger ms-2 px-2 py-0" title="Sil" onclick="this.parentElement.remove()">
          <i class="fas fa-times"></i>
        </button>`;
      grp.appendChild(slot);
    }

    async function fetchProfile() {
      try {
        const res = await fetch('/api/teacher/profile/', { credentials: 'include' });
        const { teacher, success } = await res.json();
        if (!success) return;

        document.getElementById('teacherName').textContent = teacher.full_name;
        document.getElementById('teacherEmail').textContent = teacher.email;

        if (teacher.profile_photo) {
          const src = teacher.profile_photo.startsWith('/uploads/')
            ? teacher.profile_photo
            : `/uploads/${teacher.profile_photo}`;
          document.getElementById('photoPreview').src = src;
        }

        renderSubjectCheckboxes(); renderAvailability();

        const lp = typeof teacher.lesson_prices === 'string' ? JSON.parse(teacher.lesson_prices) : teacher.lesson_prices || {};
        const subjectIds = Object.entries(subjects).reduce((acc, [id, label]) => {
          acc[label] = id;
          return acc;
        }, {});

        Object.entries(lp).forEach(([label, pr]) => {
          const id = subjectIds[label]; // örn: "Matematik" -> "math"
          const cb = document.getElementById(id);
          if (cb) {
            cb.checked = true;
            cb.dispatchEvent(new Event('change'));

            requestAnimationFrame(() => {
              const waitForInput = () => {
                const input = document.getElementById(`price-${id}`);
                if (input) {
                  input.value = pr;
                } else {
                  requestAnimationFrame(waitForInput);
                }
              };
              waitForInput();
            });
          }
        });

        const av = typeof teacher.availability === 'string' ? JSON.parse(teacher.availability) : teacher.availability || [];
        av.forEach(slot => {
          const idx = daysOfWeek.indexOf(slot.day);
          if (idx >= 0 && slot.start && slot.end) {
            document.getElementById(`day-${idx}`).checked = true;
            document.getElementById(`day-${idx}`).dispatchEvent(new Event('change'));
            addSlot(idx);
            const last = document.getElementById(`slotGroup-${idx}`).lastElementChild;
            if (last) {
              last.querySelector('.start-time').value = slot.start;
              last.querySelector('.end-time').value = slot.end;
            }
          }
        });
      } catch (err) {
        console.error(err);
      }
    }

    document.getElementById('editForm').addEventListener('submit', async e => {
      e.preventDefault();
      const fd = new FormData(e.target);

      const prices = {};
      document.querySelectorAll('.subject-check:checked').forEach(cb => {
        const id = cb.id;
        const label = subjects[id];
        const priceInput = document.getElementById(`price-${id}`);
        if (priceInput && priceInput.value.trim() !== "") {
          prices[label] = priceInput.value.trim();
        }
      });

      const availability = [];

      try {
        daysOfWeek.forEach((day, idx) => {
          if (document.getElementById(`day-${idx}`).checked) {
            document.querySelectorAll(`#slotGroup-${idx} .availability-slot`).forEach(slot => {
              const start = slot.querySelector('.start-time')?.value;
              const end = slot.querySelector('.end-time')?.value;

              if (!start || !end) throw new Error(`${day} günü için tüm saat aralıklarını doldurun.`);
              const startMin = toMins(start);
              const endMin = toMins(end);

              if (endMin <= startMin) throw new Error(`${day} günü için bitiş saati başlangıçtan sonra olmalı.`);
              if (endMin - startMin < 60) throw new Error(`${day} günü için saat aralığı en az 1 saat olmalı: ${start} - ${end}`);

              availability.push({ day, start, end });
            });
          }
        });

        fd.set('prices', JSON.stringify(prices));
        fd.set('availability', JSON.stringify(availability));

        const res = await fetch('/api/teacher/profile/update-profile', {
          method: 'POST',
          credentials: 'include',
          body: fd
        });

        const json = await res.json();
        if (!json.success) throw new Error(json.message);

        alert("✅ Dersler ve saatler başarıyla güncellendi!");
        window.location.href = "/pages/teacher_dashboard.html";
      } catch (err) {
        alert("❌ " + err.message);
        console.error(err);
      }
    });

    document.addEventListener('DOMContentLoaded', fetchProfile);
  </script>
</body>

</html>
