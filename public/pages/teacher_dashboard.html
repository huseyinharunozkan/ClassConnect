  <main class="flex-fill">
    <div class="container my-5">
      <h2 class="text-center mb-5">📚 Eğitmen Paneli</h2>
      <div class="row g-4 justify-content-center">
        <div class="col-md-8">
          <div class="text-center mt-4 mb-3">
            <button id="joinLiveLesson" class="btn btn-info btn-lg">🔵 Canlı Derse Katıl</button>
          </div>

          <div class="card mb-4">
            <div class="card-header bg-warning">🗓️ Bugünkü Dersler</div>
            <ul class="list-group list-group-flush" id="todayLessonsList">
              <li class="list-group-item text-muted">Henüz bugüne özel ders yok.</li>
            </ul>
          </div>

          <div class="card mb-4">
            <div class="card-header bg-success text-white">🔄 Onay Bekleyen Dersler</div>
            <ul class="list-group list-group-flush" id="activeLessonsList">
              <li class="list-group-item text-muted">Onay bekleyen ders yok.</li>
            </ul>
          </div>

          <div class="card">
            <div class="card-header bg-secondary text-white">📚 Aktif Randevular</div>
            <ul class="list-group list-group-flush" id="allLessonsList">
              <li class="list-group-item text-muted">Henüz aktif randevu yok.</li>
            </ul>
          </div>
        </div>
      </div>
    </div>

<!-- Öğrenci Bilgisi Modal -->
<div class="modal fade" id="studentInfoModal" tabindex="-1"
aria-labelledby="studentInfoModalLabel" aria-hidden="true">
<div class="modal-dialog">
<div class="modal-content">
 <div class="modal-header">
   <h5 class="modal-title" id="studentInfoModalLabel">Öğrenci Bilgileri</h5>
   <button type="button" class="btn-close" data-bs-dismiss="modal"
           aria-label="Kapat"></button>
 </div>
 <div class="modal-body">
   <p><strong>Ad Soyad:</strong> <span id="modalStudentName"></span></p>
   <p><strong>Email:</strong>      <span id="modalStudentEmail"></span></p>
   <p><strong>Adres:</strong>      <span id="modalStudentAddress"></span></p>
 </div>
 <div class="modal-footer">
   <button type="button" class="btn btn-secondary"
           data-bs-dismiss="modal">Kapat</button>
 </div>
</div>
</div>
</div>



  <footer id="footer-placeholder" class="mt-auto">
    <script src="../js/footer_loader.js"></script>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    function formatDate(d) {
      return new Date(d).toLocaleDateString('tr-TR', {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
      });
    }
    function stripSeconds(t) {
      return t.replace(/:00$/, '');
    }

    async function logout() {
      await fetch('/api/logout',{method:'POST',credentials:'include'});
      window.location.href = '/pages/login.html';
    }

    async function loadTeacherProfile() {
      try {
        const res = await fetch('/api/teacher/profile', { credentials:'include' });
        const data = await res.json();
        if (!data.success) return;
        const t = data.teacher;
        document.getElementById('teacherFullName').textContent = t.full_name;
        if (t.profile_photo) {
          document.getElementById('teacherProfilePic').src =
            t.profile_photo.startsWith('/uploads/') ? t.profile_photo : `/uploads/${t.profile_photo}`;
        }
      } catch(e){ console.error(e) }
    }

    async function cancelAppointment(id, btn) {
      if (!confirm('Bu randevuyu iptal etmek istediğinize emin misiniz?')) return;
      try {
        const res = await fetch(`/api/appointments/${id}/cancel`, {
          method: 'PATCH',
          credentials: 'include'
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.message);
        const li = btn.closest('li');
        if (li) li.remove();
        const ul = document.getElementById('allLessonsList');
        if (!ul.hasChildNodes()) {
          ul.innerHTML = '<li class="list-group-item text-muted">Henüz aktif randevu yok.</li>';
        }
      } catch (err) {
        alert('İptal edilemedi: ' + err.message);
      }
    }

    async function loadToday() {
      const today = new Date().toISOString().split('T')[0];
      try {
        const res = await fetch(`/api/appointments/teacher/today?date=${today}`,{credentials:'include'});
        const data = await res.json();
        const ul   = document.getElementById('todayLessonsList');
        ul.innerHTML = '';
        if (!data.success || !data.appointments.length) {
          ul.innerHTML = '<li class="list-group-item text-muted">Henüz bugüne özel ders yok.</li>';
          return;
        }
        data.appointments.forEach(a => {
          ul.insertAdjacentHTML('beforeend', `
            <li class="list-group-item">
              <strong>${formatDate(a.appointment_date)}, ${stripSeconds(a.start_time)} – ${stripSeconds(a.end_time)}</strong><br>
              <small>${a.lesson} | Öğrenci: ${a.student_name}</small>
            </li>`);
        });
      } catch(e){ console.error(e) }
    }

    async function loadPending() {
      const res  = await fetch('/api/appointments/pending-teacher', {
        credentials: 'include'
      });
      const data = await res.json();
      const ul   = document.getElementById('activeLessonsList');
      ul.innerHTML = '';

      if (!data.success || !data.appointments.length) {
        ul.innerHTML = '<li class="list-group-item text-muted">Onay bekleyen ders yok.</li>';
        return;
      }

      data.appointments.forEach(a => {
  ul.insertAdjacentHTML('beforeend', `
    <li class="list-group-item d-flex justify-content-between align-items-start flex-wrap">
      <div
        class="lesson-info flex-grow-1"
        style="cursor: pointer;"
        data-bs-toggle="modal"
        data-bs-target="#studentInfoModal"
        data-student-id="${a.student_id}"
            >
              <strong>${formatDate(a.appointment_date)}, ${stripSeconds(a.start_time)} – ${stripSeconds(a.end_time)}</strong><br>
              <small>${a.lesson} | Öğrenci: ${a.student_name}</small>
            </div>
            <div>
              <button class="btn btn-sm btn-success me-2" onclick="handleApprove(${a.id})">Onayla</button>
              <button class="btn btn-sm btn-danger" onclick="handleReject(${a.id})">Reddet</button>
            </div>
          </li>
        `);
      });
    }

    async function loadActive() {
      const ul = document.getElementById('allLessonsList');
      const today = new Date().toISOString().split('T')[0];
      ul.innerHTML = '';
      try {
        const res = await fetch('/api/appointments/teacher/confirmed', { credentials:'include' });
        const data = await res.json();
        if (!data.success || !Array.isArray(data.appointments)) {
          ul.innerHTML = '<li class="list-group-item text-muted">Henüz aktif randevu yok.</li>';
          return;
        }
        const upcoming = data.appointments.filter(a => {
          const d = new Date(a.appointment_date);
          const localYMD = new Date(d.getTime() - d.getTimezoneOffset()*60000)
                              .toISOString().split('T')[0];
          return localYMD !== today;
        });
        if (upcoming.length) {
          upcoming.forEach(a => {
            ul.insertAdjacentHTML('beforeend', `
              <li class="list-group-item d-flex justify-content-between align-items-center">
                <div>
                  <strong>${formatDate(a.appointment_date)}, ${stripSeconds(a.start_time)} – ${stripSeconds(a.end_time)}</strong><br>
                  <small>${a.lesson} | Öğrenci: ${a.student_name}</small>
                </div>
                <button class="btn btn-sm btn-danger" onclick="cancelAppointment(${a.id}, this)">İptal Et</button>
              </li>`);
          });
        } else {
          ul.innerHTML = '<li class="list-group-item text-muted">Henüz aktif randevu yok.</li>';
        }
      } catch (err) {
        console.error('Aktif randevular yüklenemedi', err);
        ul.innerHTML = '<li class="list-group-item text-danger">Sunucu hatası</li>';
      }
    }

    async function handleApprove(id) {
      if (!confirm('Bu dersi onaylamak istediğinize emin misiniz?')) return;
      try {
        const res = await fetch('/api/appointments/approve', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id })
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.message);
        await Promise.all([ loadPending(), loadActive(), loadToday() ]);
      } catch (err) {
        alert('Onaylanırken hata oluştu: ' + err.message);
      }
    }

    async function handleReject(id) {
      if (!confirm('Bu dersi reddetmek istediğinize emin misiniz?')) return;
      try {
        const res = await fetch('/api/appointments/reject', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id })
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.message);
        await loadPending();
      } catch (err) {
        alert('Reddedilirken hata oluştu: ' + err.message);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadTeacherProfile();
      loadToday();
      loadPending();
      loadActive();
    });

    document.getElementById("joinLiveLesson").addEventListener("click", async () => {
      try {
        const res = await fetch("/api/live-session/today", { credentials: 'include' });
        const data = await res.json();
        if (data.success && data.session_id) {
          window.location.href = `/pages/live_session_teacher.html?session=${data.session_id}`;
        } else {
          alert("Bugün için canlı ders oturumu bulunamadı.");
        }
      } catch (err) {
        console.error("Canlı derse yönlendirme hatası:", err);
        alert("Sunucu hatası: canlı ders oturumu alınamadı.");
      }
    });
    // Öğrenci modal’ını açarken çağrılacak
    async function showStudentInfoModal(event) {
      const triggerEl = event.relatedTarget;
      const studentId = triggerEl.dataset.studentId;
      console.log('dataset.studentId:', studentId);

      try {
        const res = await fetch(`/api/student/${studentId}`, { credentials: 'include' });
        if (!res.ok) throw new Error(`Sunucu hatası: ${res.status}`);
        const json = await res.json();
        if (!json.success) throw new Error(json.message);

        const s = json.student;
        document.getElementById("modalStudentName").textContent    = s.full_name;
        document.getElementById("modalStudentEmail").textContent   = s.email;
        document.getElementById("modalStudentAddress").textContent = s.address || '-';
      }
      catch (err) {
        console.error('Öğrenci bilgisi yüklenemedi:', err);
        document.getElementById("modalStudentName").textContent    = 'Hata';
        document.getElementById("modalStudentEmail").textContent   = 'Hata';
        document.getElementById("modalStudentAddress").textContent = 'Hata';
      }
    }

    // Bir kere dinlemesi yeterli
    const studentInfoModalEl = document.getElementById('studentInfoModal');
    studentInfoModalEl.addEventListener('show.bs.modal', showStudentInfoModal);
  </script>
</body>
