<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Canlı Ders Takibi (Öğrenci) | ClassConnect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    body { background-color: #f4f8f9; font-family: Arial, sans-serif; }
    .lesson-box { max-width: 600px; margin: 50px auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1); text-align: center; }
    .lesson-logo { width: 90px; margin-bottom: 20px; }
    #timer { font-size: 32px; color: #007bff; font-weight: bold; margin-top: 10px; }
  </style>
</head>

<body>
<div class="lesson-box">
  <img src="/media/logo.png" class="lesson-logo" alt="ClassConnect Logo">
  <h2>📚 Canlı Ders Takibi</h2>
  <p><strong>👨‍🎓 Öğrenci:</strong> <span id="studentName">–</span></p>
  <p><strong>👩‍🏫 Öğretmen:</strong> <span id="teacherName">–</span></p>
  <p><strong>📘 Ders:</strong> <span id="subjectName">–</span></p>
  <div class="mt-4" id="buttonArea">
    <p class="text-muted">Öğretmenin eve girmesini bekliyorsunuz...</p>
  </div>
  <p class="mt-4"><small>⏱️ Geçen Süre:</small></p>
  <div id="timer">00:00</div>
</div>
<div class="text-center mt-5">
  <br>
  <button class="btn btn-outline-danger" onclick="window.location.href='tel:112';">🚨 Acil Durum (112)</button>
</div>

<script>
let seconds = 0;
let timerInterval = null;
let exitConfirmed = false;
const sessionId = new URLSearchParams(window.location.search).get("session");
const timerDisplay = document.getElementById("timer");
const buttonArea = document.getElementById("buttonArea");

if (!sessionId) {
  alert("Geçersiz canlı ders bağlantısı.");
  window.location.href = "/pages/student_dashboard.html";
}
loadSessionInfo(); // sayfa açıldığında bilgileri getir

async function loadSessionInfo() {
  try {
    const res = await fetch(`/api/live-session/${sessionId}/info`);
    const data = await res.json();
    if (data.success) {
      document.getElementById("studentName").textContent = data.student_name;
      document.getElementById("teacherName").textContent = data.teacher_name;
      document.getElementById("subjectName").textContent = data.lesson_name;
    } else {
      console.warn("Canlı ders bilgisi bulunamadı.");
    }
  } catch (err) {
    console.error("Canlı ders info hatası:", err);
  }
}


  setInterval(checkTeacherStatus, 5000);

  async function checkTeacherStatus() {
    try {
      const res = await fetch(`/api/live-session/${sessionId}/status`);
      const { session } = await res.json();

      if (session.teacher_entered_home && !session.student_entered_home) {
        showEnterHomeButton();

      } else if (session.teacher_ready && session.student_entered_home && !session.student_ready) {
        showReadyButton();

      } else if (session.teacher_confirm_started && session.student_ready && !session.student_confirm_started) {
        showStartConfirmButton();

      } else if (
        session.status === 'started' &&
        session.student_confirm_started &&
        !timerInterval
      ) {
        startTimer();

      } else if (
        session.teacher_confirm_ended &&
        !session.student_confirm_ended
      ) {
        showEndConfirmButton(); // ✅ sayaç burada duracak

      } else if (
        session.teacher_confirm_ended &&
        session.student_confirm_ended &&
        session.teacher_confirm_exit &&
        !session.student_confirm_exit &&
        !exitConfirmed
      ) {
        showExitConfirmButton();

      } else if (
        session.teacher_confirm_exit &&
        session.student_confirm_exit &&
        timerInterval
      ) {
        stopTimer();
        buttonArea.innerHTML = `<p class="text-success">✅ Ders ve çıkış tamamlandı!</p>`;
      }

    } catch (err) {
      console.error('Durum kontrol hatası:', err);
    }
  }

  function showEnterHomeButton() {
    buttonArea.innerHTML = `
      <button class="btn btn-primary w-100 my-2" id="enterHomeBtn">🏠 Öğretmen eve girdi.</button>
    `;
    document.getElementById("enterHomeBtn").addEventListener("click", async () => {
      await fetch(`/api/live-session/${sessionId}/student-entered`, { method: 'POST' });
      buttonArea.innerHTML = `<p class="text-muted">👩‍🏫 Öğretmenin hazır olmasını bekliyorsunuz...</p>`;
    });
  }

  function showReadyButton() {
    buttonArea.innerHTML = `
      <button class="btn btn-success w-100 my-2" id="readyBtn">✅ Derse Hazırım</button>
    `;
    document.getElementById("readyBtn").addEventListener("click", async () => {
      await fetch(`/api/live-session/${sessionId}/student-ready`, { method: 'POST' });

      buttonArea.innerHTML = `<p class="text-muted">👩‍🏫 Öğretmenin dersi başlatmasını bekliyorsunuz...</p>`;
    });
  }

  function showStartConfirmButton() {
    buttonArea.innerHTML = `
      <button class="btn btn-info w-100 my-2" id="confirmStartBtn">🚀 Ders Başladı</button>
    `;
    document.getElementById("confirmStartBtn").addEventListener("click", async () => {
      await fetch(`/api/live-session/${sessionId}/student-start-confirm`, { method: 'POST' });
      startTimer();
      buttonArea.innerHTML = `<p class="text-muted">⏱️ Ders devam ediyor...</p>`;
    });
  }

  function showEndConfirmButton() {
    buttonArea.innerHTML = `
      <button class="btn btn-warning w-100 my-2" id="endConfirmBtn">🛑 Ders Bitti</button>
    `;
    document.getElementById("endConfirmBtn").addEventListener("click", async () => {
      await fetch(`/api/live-session/${sessionId}/student-end-confirm`, { method: 'POST' });
      if (timerInterval) stopTimer(); // ✅ SAYAÇ DURUR
      buttonArea.innerHTML = `<p class="text-muted">👩‍🏫 Öğretmenin çıkış yapması bekleniyor...</p>`;
    });
  }

  function showExitConfirmButton() {
    if (exitConfirmed) return;
    buttonArea.innerHTML = `
      <button class="btn btn-secondary w-100 my-2" id="exitConfirmBtn">🚶‍♂️ Öğretmen evden çıktı</button>
    `;
    document.getElementById("exitConfirmBtn").addEventListener("click", async () => {
      await fetch(`/api/live-session/${sessionId}/student-exit-confirm`, { method: 'POST' });
      exitConfirmed = true;
    });
  }

  function startTimer() {
    timerInterval = setInterval(() => {
      seconds++;
      const m = Math.floor(seconds / 60).toString().padStart(2, '0');
      const s = (seconds % 60).toString().padStart(2, '0');
      timerDisplay.textContent = `${m}:${s}`;
    }, 1000);
  }

  function stopTimer() {
    clearInterval(timerInterval);
  }

</script>


</body>
</html>
