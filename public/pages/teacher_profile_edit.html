<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Öğretmen Profil Düzenle | ClassConnect</title>

  <script src="../js/head_loader.js" defer></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    .profile-card {
      border-radius: 12px;
      overflow: hidden;
    }

    .profile-photo {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .upload-btn {
      position: absolute;
      bottom: -8px;
      right: -8px;
      background: var(--primary);
      color: #fff;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
  </style>
</head>

<body class="d-flex flex-column min-vh-100">

  <!-- Navbar -->
  <div id="navbar-placeholder"></div>
  <script src="../js/navbar_loader.js" defer></script>

  <main class="flex-fill">
    <div class="container d-flex justify-content-center my-5">
      <div class="col-md-8 col-lg-6">
        <div class="card shadow p-4">
          <h2 class="text-center mb-4">👨‍🏫 Profil Düzenle</h2>

          <!-- Profil Fotoğrafı -->
          <div class="photo-wrapper">
            <img src="/uploads/default.png" alt="Profil Fotoğrafı" id="profilePreview" class="profile-photo">
            <button type="button" id="deletePhotoBtn" class="delete-photo-btn">✖</button>
          </div>
          <div class="text-center mb-4">
            <input type="file" id="profilePhoto" accept="uploads/*" class="form-control mb-2">
            <button type="button" id="uploadPhotoBtn" class="btn btn-secondary">📤 Yükle</button>
          </div>


          <!-- Profil Bilgileri Formu -->
          <form id="profileForm" enctype="multipart/form-data">

            <div class="mb-3">
              <label class="form-label">Ad Soyad</label>
              <input type="text" class="form-control" id="fullName" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" id="email" readonly />
            </div>
            <!-- Büşra ekledi (77-192)-->
            <div class="mb-3">
              <label for="location" class="form-label">Şehir</label>
              <select class="form-select" id="location" name="location" required>
                <option value="">Şehir seçiniz</option>
                <option>Adana</option>
                <option>Adıyaman</option>
                <option>Afyonkarahisar</option>
                <option>Ağrı</option>
                <option>Amasya</option>
                <option>Ankara</option>
                <option>Antalya</option>
                <option>Artvin</option>
                <option>Aydın</option>
                <option>Balıkesir</option>
                <option>Bartın</option>
                <option>Batman</option>
                <option>Bayburt</option>
                <option>Bilecik</option>
                <option>Bingöl</option>
                <option>Bitlis</option>
                <option>Bolu</option>
                <option>Burdur</option>
                <option>Bursa</option>
                <option>Çanakkale</option>
                <option>Çankırı</option>
                <option>Çorum</option>
                <option>Denizli</option>
                <option>Diyarbakır</option>
                <option>Düzce</option>
                <option>Edirne</option>
                <option>Elazığ</option>
                <option>Erzincan</option>
                <option>Erzurum</option>
                <option>Eskişehir</option>
                <option>Gaziantep</option>
                <option>Giresun</option>
                <option>Gümüşhane</option>
                <option>Hakkari</option>
                <option>Hatay</option>
                <option>Iğdır</option>
                <option>Isparta</option>
                <option>İstanbul</option>
                <option>İzmir</option>
                <option>Kahramanmaraş</option>
                <option>Karabük</option>
                <option>Karaman</option>
                <option>Kars</option>
                <option>Kastamonu</option>
                <option>Kayseri</option>
                <option>Kilis</option>
                <option>Kırıkkale</option>
                <option>Kırklareli</option>
                <option>Kırşehir</option>
                <option>Kocaeli</option>
                <option>Konya</option>
                <option>Kütahya</option>
                <option>Malatya</option>
                <option>Manisa</option>
                <option>Mardin</option>
                <option>Mersin</option>
                <option>Muğla</option>
                <option>Muş</option>
                <option>Nevşehir</option>
                <option>Niğde</option>
                <option>Ordu</option>
                <option>Osmaniye</option>
                <option>Rize</option>
                <option>Sakarya</option>
                <option>Samsun</option>
                <option>Siirt</option>
                <option>Sinop</option>
                <option>Sivas</option>
                <option>Şanlıurfa</option>
                <option>Şırnak</option>
                <option>Tekirdağ</option>
                <option>Tokat</option>
                <option>Trabzon</option>
                <option>Tunceli</option>
                <option>Uşak</option>
                <option>Van</option>
                <option>Yalova</option>
                <option>Yozgat</option>
                <option>Zonguldak</option>
              </select>
            </div>
            <script>
              const location = document.getElementById('location');

              // 1) Sayfa yüklenince öğretmenin güncel profilinden şehri çekip işaretle
              document.addEventListener('DOMContentLoaded', async () => {
                try {
                  const res = await fetch('/api/teacher/profile', { credentials: 'include' });
                  if (!res.ok) throw new Error('Profil yüklenemedi');
                  const data = await res.json();
                  if (data.location) {
                    location.value = data.location;               // select içinden data.city eşleşeni seçer
                  }
                } catch (err) {
                  console.error('Öğretmen profili yükleme hatası:', err);
                }
              });

              // 2) Odaklanınca 5 satır göster (scroll’lu)
              location.addEventListener('focus', function () {
                this.size = 5;
              });
              // 3) Seçim yapıldığında açılır listeyi kapat
              location.addEventListener('change', function () {
                this.blur();
              });
              // 4) Odaktan çıkınca tekrar tek satırlı dropdown’a dön
              location.addEventListener('blur', function () {
                this.size = 1;
              });
            </script>

            <div class="mb-3">
              <label class="form-label">Telefon</label>
              <input type="text" class="form-control" id="phoneNumber" />
            </div>
            <div class="mb-3">
              <label class="form-label">Üniversite</label>
              <input type="text" class="form-control" id="university" />
            </div>
            <div class="mb-3">
              <label class="form-label">Fakülte</label>
              <input type="text" class="form-control" id="faculty" />
            </div>
            <div class="mb-3">
              <label class="form-label">Bölüm</label>
              <input type="text" class="form-control" id="department" />
            </div>
            <div class="mb-3">
              <label class="form-label">Hakkımda</label>
              <input type="text" class="form-control" id="about_me" />
            </div>

            <div class="text-center mt-4">
              <button type="submit" class="btn btn-primary w-100">💾 Kaydet</button>
            </div>
          </form>

          <hr class="my-4" />
          <h4 class="text-center mb-3">🔒 Şifre Değiştir</h4>
          <form id="passwordForm" class="text-start">
            <div class="mb-3">
              <label class="form-label">Eski Şifre</label>
              <input type="password" class="form-control" id="oldPassword" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Yeni Şifre</label>
              <input type="password" class="form-control" id="newPassword" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Yeni Şifre Tekrar</label>
              <input type="password" class="form-control" id="confirmNewPassword" required />
            </div>
            <div class="text-center mt-3">
              <button type="submit" class="btn btn-warning w-100">🔒 Şifreyi Değiştir</button>
            </div>
          </form>
        </div>
      </div>
  </main>

  <footer id="footer-placeholder" class="mt-auto">
    <script src="../js/footer_loader.js" defer></script>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const API = "https://classconnect.com.tr";

      // 1) Profil verisini çek
      async function fetchTeacherProfile() {
        try {
          const res = await fetch(`${API}/api/teacher/profile/`, { credentials: 'include' });
          const { success, teacher } = await res.json();
          if (!success) return console.warn('Profil alınamadı');

          document.getElementById("fullName").value = teacher.full_name || "";
          document.getElementById("email").value = teacher.email || "";
          document.getElementById("location").value = teacher.location || "";
          document.getElementById("phoneNumber").value = teacher.phone_number || "";
          document.getElementById("university").value = teacher.university || "";
          document.getElementById("faculty").value = teacher.faculty || "";
          document.getElementById("department").value = teacher.department || "";
          document.getElementById("about_me").value = teacher.about_me || "";

          if (teacher.profile_photo) {
            document.getElementById('profilePreview').src =
              teacher.profile_photo.startsWith('/uploads/')
                ? teacher.profile_photo
                : `/uploads/${teacher.profile_photo}`;
          }
        } catch (err) {
          console.error(err);
        }
      }
      fetchTeacherProfile();

      // 2) Fotoğraf önizleme
      document.getElementById("profilePhoto").addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (file) {
          document.getElementById("profilePreview").src = URL.createObjectURL(file);
        }
      });

      // 3) Fotoğraf silme
      document.getElementById("deletePhotoBtn").addEventListener("click", () => {
        if (confirm("Profil fotoğrafını silmek istediğinize emin misiniz?")) {
          document.getElementById("profilePreview").src = "/uploads/default.png";
        }
      });

      // 4) Fotoğraf yükleme
      document.getElementById("uploadPhotoBtn").addEventListener("click", async () => {
        const file = document.getElementById("profilePhoto").files[0];
        if (!file) return alert("Lütfen bir fotoğraf seçin.");
        try {
          const fd = new FormData();
          fd.append("profilePhoto", file);
          const res = await fetch(`${API}/api/teacher/profile/upload-photo`, {
            method: "POST",
            credentials: "include",
            body: fd,
          });
          const up = await res.json();
          if (!res.ok) throw new Error(up.message);
          document.getElementById("profilePreview").src = up.filePath;
          alert("✅ Fotoğraf yüklendi");
        } catch (err) {
          console.error(err);
          alert("Fotoğraf yüklenirken bir hata oluştu.");
        }
      });

      // 5) Profil bilgilerini güncelle
      document.getElementById("profileForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        try {
          const body = {
            name: document.getElementById("fullName").value.trim(),
            email: document.getElementById("email").value.trim(),
            location: document.getElementById("location").value.trim(),
            phone: document.getElementById("phoneNumber").value.trim(),
            university: document.getElementById("university").value.trim(),
            faculty: document.getElementById("faculty").value.trim(),
            department: document.getElementById("department").value.trim(),
            about: document.getElementById("about_me").value.trim(),
          };
          const res = await fetch(`${API}/api/teacher/profile/update-profile`, {
            method: "POST",
            credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          const upd = await res.json();
          if (!res.ok) throw new Error(upd.message);
          alert("✅ Profil güncellendi!");
          window.location.href = "/pages/after_login_teacher.html";
        } catch (err) {
          console.error(err);
          alert("Profil güncellenirken bir hata oluştu.");
        }
      });




      // 6) Şifre değiştirme
      document.getElementById("passwordForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const oldP = document.getElementById("oldPassword").value;
        const newP = document.getElementById("newPassword").value;
        const cP = document.getElementById("confirmNewPassword").value;
        if (newP !== cP) return alert("❌ Şifreler eşleşmiyor!");
        try {
          const res = await fetch(`${API}/api/teacher/profile/change-password`, {
            method: "POST",
            credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ oldPassword: oldP, newPassword: newP }),
          });
          const pw = await res.json();
          if (!res.ok) throw new Error(pw.message);
          alert("✅ Şifre değiştirildi!");
          e.target.reset();
        } catch (err) {
          console.error(err);
          alert("Şifre değiştirirken bir hata oluştu.");
        }
      });
    });
  </script>
</body>

</html>
