<!-- public/pages/be_student.html -->
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Öğrenci Ol | ClassConnect</title>
  <script src="../js/head_loader.js" defer></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(to right, #e3f2fd, #f3e5f5);
    }
    .register-container {
      max-width: 400px;
      margin-top: 80px;
      background-color: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
    }
    .form-control {
      border-radius: 8px;
    }
    .btn-primary, .btn-danger {
      width: 100%;
      border-radius: 8px;
    }
    .logo {
      height: 90px;
    }
  </style>
</head>
<body class="d-flex flex-column min-vh-100">

  <div id="navbar-placeholder"></div>
  <script src="../js/navbar_loader.js"></script>

  <main class="flex-fill d-flex justify-content-center align-items-center my-5">
    <div class="register-container text-center col-md-8 col-lg-6 mt-0">
      <img src="../media/logo.png" class="logo mb-3" alt="ClassConnect Logo">
      <h4 class="mb-4 fw-semibold">Öğrenci Kayıt</h4>

      <div id="alert" class="alert alert-success d-none"></div>

      <form id="registerForm">
        <div class="mb-3 text-start">
          <label for="fullName" class="form-label">Ad Soyad:</label>
          <input type="text" id="fullName" name="fullName" class="form-control" placeholder="Adınızı girin" required>
        </div>
        <div class="mb-3 text-start">
          <label for="email" class="form-label">Email adresi:</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="Emailinizi girin" required>
        </div>
        <div class="mb-3 text-start">
          <label for="password" class="form-label">Şifre:</label>
          <div class="input-group">
            <input type="password" class="form-control" id="password" placeholder="Şifrenizi girin" required>
            <button id="togglePasswordBtn" class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility()">
              <i id="eyeIcon" class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <div id="codeSection" class="mb-3 d-none">
          <label for="code" class="form-label">Doğrulama Kodu:</label>
          <input type="text" id="code" name="code" class="form-control" maxlength="6" placeholder="6 haneli kod">
        </div>

        <button type="submit" id="registerBtn" class="btn btn-primary mb-2">Kayıt Ol</button>
        <button type="button" id="verifyBtn" class="btn btn-success w-100 py-2 mt-2 d-none">Kodu Doğrula</button>
      </form>

      <p class="mt-3">veya</p>

      <button type="button" class="btn btn-danger" onclick="window.location.href='https://classconnect.com.tr/auth/google'">
        <img src="https://img.icons8.com/color/16/000000/google-logo.png" class="me-2" alt="Google Logo">
        Google ile Kayıt Ol
      </button>

    </div>
  </main>

  <footer id="footer-placeholder" class="mt-auto">
    <script src="../js/footer_loader.js"></script>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    (function () {
      const API_BASE = 'https://classconnect.com.tr';
      const form = document.getElementById('registerForm');
      const fullNameEl = document.getElementById('fullName');
      const emailEl = document.getElementById('email');
      const passEl = document.getElementById('password');
      const codeEl = document.getElementById('code');
      const registerBtn = document.getElementById('registerBtn');
      const verifyBtn = document.getElementById('verifyBtn');
      const codeSection = document.getElementById('codeSection');
      const alertDiv = document.getElementById('alert');
      let savedEmail = '';

      function showAlert(msg, type = 'danger') {
        alertDiv.textContent = msg;
        alertDiv.className = `alert alert-${type}`;
        alertDiv.style.display = 'block';
        setTimeout(() => alertDiv.style.display = 'none', 5000);
      }

      form.addEventListener('submit', async e => {
        e.preventDefault();
        const fullName = fullNameEl.value.trim();
        const email = emailEl.value.trim();
        const password = passEl.value;

        if (!fullName || !email || !password) {
          return showAlert('Lütfen tüm alanları doldurun');
        }

        registerBtn.disabled = true;
        try {
          const res = await fetch(`${API_BASE}/api/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ fullName, email, password })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.message);

          savedEmail = email;
          showAlert(data.message, 'success');
          codeSection.classList.remove('d-none');
          registerBtn.classList.add('d-none');
          verifyBtn.classList.remove('d-none');
        } catch (err) {
          showAlert(err.message || 'Sunucu hatası');
        } finally {
          registerBtn.disabled = false;
        }
      });

      verifyBtn.addEventListener('click', async () => {
        const code = codeEl.value.trim();
        if (!/^\d{6}$/.test(code)) {
          return showAlert('Lütfen 6 haneli kod girin');
        }

        verifyBtn.disabled = true;
        try {
          const res = await fetch(`${API_BASE}/api/verify`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ email: savedEmail, code })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.message);

          showAlert('Doğrulama başarılı, yönlendiriliyorsunuz...', 'success');
          setTimeout(() => window.location.href = data.redirect, 1500);
        } catch (err) {
          showAlert(err.message || 'Doğrulama hatası');
        } finally {
          verifyBtn.disabled = false;
        }
      });
    })();

    function togglePasswordVisibility() {
        const passwordInput = document.getElementById('password');
        const toggleBtn = document.getElementById('togglePasswordBtn');
        const eyeIcon = document.getElementById('eyeIcon');

        const isVisible = passwordInput.type === 'text';
        passwordInput.type = isVisible ? 'password' : 'text';

        eyeIcon.className = isVisible ? 'bi bi-eye' : 'bi bi-eye-slash';
        toggleBtn.style.backgroundColor = isVisible ? '#f8f9fa' : '#9384e6';
        toggleBtn.style.color = isVisible ? '#000' : '#fff';
      }
  </script>
</body>
</html>
