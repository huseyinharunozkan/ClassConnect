<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Şifremi Unuttum | ClassConnect</title>

  <script src="../js/head_loader.js" defer></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(to right, #e3f2fd, #f3e5f5);
    }
    .fp-container {
      max-width: 400px;
      margin: 80px auto;
      background-color: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
    }
    .form-control {
      border-radius: 8px;
    }
    .btn-primary {
      width: 100%;
      border-radius: 8px;
    }
    .logo {
      height: 90px;
    }
  </style>
</head>

<body class="d-flex flex-column min-vh-100">
  <!-- Navbar -->
  <div id="navbar-placeholder"></div>
  <script src="../js/navbar_loader.js"></script>

  <main class="flex-fill d-flex justify-content-center align-items-start">
    <div class="fp-container text-center">
      <img src="../media/logo.png" alt="ClassConnect Logo" class="logo mb-3">
      <h4 class="mb-4 fw-semibold">Şifremi Unuttum</h4>

      <div id="alert" class="alert d-none" role="alert"></div>

      <!-- Adım 1: Email Gönder -->
      <form id="step1Form">
        <div class="mb-3 text-start">
          <label for="fpEmail" class="form-label">Kayıtlı E-posta</label>
          <input type="email" id="fpEmail" class="form-control" placeholder="example@domain.com" required>
        </div>
        <button type="submit" class="btn btn-primary" id="sendCodeBtn">Kod Gönder</button>
      </form>

      <!-- Adım 2: Kod & Yeni Şifre -->
      <form id="step2Form" class="d-none mt-4">
        <div class="mb-3 text-start">
          <label for="fpCode" class="form-label">Doğrulama Kodu</label>
          <input type="text" id="fpCode" class="form-control" placeholder="6 haneli kod" maxlength="6" required>
        </div>
        <div class="mb-3 text-start">
          <label for="fpNewPwd" class="form-label">Yeni Şifre</label>
          <input type="password" id="fpNewPwd" class="form-control" placeholder="Yeni şifrenizi girin" required>
        </div>
        <div class="mb-3 text-start">
          <label for="fpConfirmPwd" class="form-label">Şifreyi Onayla</label>
          <input type="password" id="fpConfirmPwd" class="form-control" placeholder="Şifrenizi tekrar girin" required>
        </div>
        <button type="submit" class="btn btn-primary" id="resetPwdBtn">Şifreyi Sıfırla</button>
      </form>

      <div class="mt-3">
        <a href="login.html" class="text-decoration-none">&larr; Giriş Sayfasına Dön</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer id="footer-placeholder" class="mt-auto">
    <script src="../js/footer_loader.js"></script>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const API_BASE = 'https://classconnect.com.tr';
      const alertEl = document.getElementById('alert');

      const step1Form   = document.getElementById('step1Form');
      const fpEmail     = document.getElementById('fpEmail');
      const sendCodeBtn = document.getElementById('sendCodeBtn');

      const step2Form     = document.getElementById('step2Form');
      const fpCode        = document.getElementById('fpCode');
      const fpNewPwd      = document.getElementById('fpNewPwd');
      const fpConfirmPwd  = document.getElementById('fpConfirmPwd');
      const resetPwdBtn   = document.getElementById('resetPwdBtn');

      function showAlert(msg, type = 'danger') {
        alertEl.textContent = msg;
        alertEl.className = `alert alert-${type}`;
        alertEl.classList.remove('d-none');
      }

      // Adım 1: Kod Gönder
      step1Form.addEventListener('submit', async e => {
        e.preventDefault();
        sendCodeBtn.disabled = true;
        try {
          const res = await fetch(`${API_BASE}/api/forgot-password/request`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: fpEmail.value.trim().toLowerCase() })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.message || 'Hata oluştu');
          showAlert('E-posta adresinize kod gönderildi.', 'success');
          step1Form.classList.add('d-none');
          step2Form.classList.remove('d-none');
        } catch (err) {
          showAlert(err.message);
        } finally {
          sendCodeBtn.disabled = false;
        }
      });

      // Adım 2: Şifre Sıfırla
      step2Form.addEventListener('submit', async e => {
        e.preventDefault();
        if (fpNewPwd.value !== fpConfirmPwd.value) {
          showAlert('Şifreler eşleşmiyor.');
          return;
        }
        resetPwdBtn.disabled = true;
        try {
          const res = await fetch(`${API_BASE}/api/forgot-password/reset`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: fpEmail.value.trim().toLowerCase(),
              code:  fpCode.value.trim(),
              newPassword: fpNewPwd.value
            })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.message || 'Hata oluştu');
          showAlert('Şifreniz başarıyla sıfırlandı.', 'success');
          setTimeout(() => window.location.href = 'login.html', 1500);
        } catch (err) {
          showAlert(err.message);
        } finally {
          resetPwdBtn.disabled = false;
        }
      });
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
