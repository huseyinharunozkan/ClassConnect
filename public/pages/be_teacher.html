<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Öğretmen Ol | ClassConnect</title>

  <script src="../js/head_loader.js" defer></script>

  <style>
    body {
      background: linear-gradient(to right, #e3f2fd, #f3e5f5);
    }
    .register-container {
      max-width: 400px;
      margin-top: 80px;
      background-color: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
    }
    .form-control {
      border-radius: 8px;
    }
    .btn-primary, .btn-secondary {
      width: 100%;
      border-radius: 8px;
    }
    .logo {
      height: 90px;
    }
  </style>
</head>

<body class="d-flex flex-column min-vh-100">

  <!-- Navbar -->
  <div id="navbar-placeholder"></div>
  <script src="../js/navbar_loader.js"></script>

  <main class="flex-fill d-flex justify-content-center align-items-center my-5">
    <div class="register-container text-center col-md-8 col-lg-6 mt-0">
      <img src="../media/logo.png" alt="ClassConnect Logo" class="logo mb-3">
      <h4 class="mb-4 fw-semibold">Öğretmen Kayıt</h4>

      <form id="registerForm">
        <div class="mb-3 text-start">
          <label class="form-label">Ad Soyad:</label>
          <input type="text" class="form-control" id="name" required placeholder="Adınızı Girin">
        </div>
        <div class="mb-3 text-start">
          <label class="form-label">Email adresi:</label>
          <input type="email" class="form-control" id="email" required placeholder="20030411060@ybu.edu.tr">
        </div>
        <div class="mb-3 text-start">
          <label class="form-label">Şifre:</label>
          <div class="input-group">
            <input type="password" class="form-control" id="password" required placeholder="Şifrenizi girin">
            <button type="button" id="togglePasswordBtn" class="btn btn-outline-secondary my-0" onclick="togglePasswordVisibility()">
              <i id="eyeIcon" class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <div id="codeSection" class="mb-3 d-none">
          <label class="form-label">Doğrulama Kodu:</label>
          <input id="code" type="text" class="form-control" maxlength="6">
        </div>

        <div id="alert" class="alert mb-3 d-none"></div>

        <button id="registerBtn" type="submit" class="btn btn-primary">Kayıt Ol</button>
        <button id="verifyBtn" type="button" class="btn btn-success w-100 mt-2 d-none">Kodu Doğrula</button>

        <div class="text-center mt-3">
          <p>veya</p>
          <button type="button" class="btn btn-secondary w-100" onclick="window.location.href='https://classconnect.com.tr/auth/microsoft'">
            <img src="https://img.icons8.com/color/16/000000/microsoft.png" class="me-2" alt="Microsoft Logo">
            Microsoft ile Kayıt Ol
          </button>
        </div>

      </form>
    </div>
  </main>

  <footer id="footer-placeholder" class="mt-auto">
    <script src="../js/footer_loader.js"></script>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const API_BASE = 'https://classconnect.com.tr';
    const LIVE_BASE = window.location.origin;

    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('registerForm');
      const nameIn = document.getElementById('name');
      const emailIn = document.getElementById('email');
      const passIn = document.getElementById('password');
      const codeSec = document.getElementById('codeSection');
      const verifyBtn = document.getElementById('verifyBtn');
      const alertDiv = document.getElementById('alert');
      const submitBtn = document.getElementById('registerBtn');
      let teacherEmail = '';

      function showAlert(msg, type = 'danger') {
        alertDiv.textContent = msg;
        alertDiv.className = `alert alert-${type}`;
        alertDiv.classList.remove('d-none');
        setTimeout(() => alertDiv.classList.add('d-none'), 5000);
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const fullName = nameIn.value.trim();
        const email = emailIn.value.trim().toLowerCase();
        const password = passIn.value;

        if (!fullName || !email || !password) {
          return showAlert('Lütfen tüm alanları doldurun');
        }

        submitBtn.disabled = true;
        const oldText = submitBtn.innerHTML;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> İşleniyor…';

        try {
          const res = await fetch(`${API_BASE}/api/teacher/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ fullName, email, password })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.message || 'Sunucu hatası');

          teacherEmail = email;
          showAlert(data.message, 'success');
          codeSec.classList.remove('d-none');
          verifyBtn.classList.remove('d-none');
          submitBtn.classList.add('d-none');
        } catch (err) {
          console.error(err);
          showAlert(err.message || 'Sunucu hatası');
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML = oldText;
        }
      });

      verifyBtn.addEventListener('click', async () => {
        const code = document.getElementById('code').value.trim();
        if (!/^\d{6}$/.test(code)) {
          return showAlert('Lütfen 6 haneli kod girin');
        }

        verifyBtn.disabled = true;
        const oldText = verifyBtn.innerHTML;
        verifyBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Doğrulanıyor…';

        try {
          const res = await fetch(`${API_BASE}/api/teacher/verify`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ email: teacherEmail, code })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.message || 'Doğrulama hatası');

          showAlert('✅ Doğrulama başarılı! Yönlendiriliyorsunuz...', 'success');

          setTimeout(() => {
            window.location.href = LIVE_BASE + data.redirect;
          }, 1500);

        } catch (err) {
          console.error(err);
          showAlert(err.message || 'Doğrulama hatası');
        } finally {
          verifyBtn.disabled = false;
          verifyBtn.innerHTML = oldText;
        }
      });
    });

    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('password');
      const toggleBtn = document.getElementById('togglePasswordBtn');
      const eyeIcon = document.getElementById('eyeIcon');

      const isVisible = passwordInput.type === 'text';
      passwordInput.type = isVisible ? 'password' : 'text';

      eyeIcon.className = isVisible ? 'bi bi-eye' : 'bi bi-eye-slash';
      toggleBtn.style.backgroundColor = isVisible ? '#f8f9fa' : '#9384e6';
      toggleBtn.style.color = isVisible ? '#000' : '#fff';
    }
  </script>

</body>
</html>
