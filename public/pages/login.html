<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giriş Yap | ClassConnect</title>

  <script src="../js/head_loader.js" defer></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(to right, #e3f2fd, #f3e5f5);
    }

    .login-container {
      max-width: 400px;
      margin-top: 80px;
      background-color: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
    }

    .form-control {
      border-radius: 8px;
    }

    .btn-primary {
      width: 100%;
      border-radius: 8px;
    }

    .logo {
      height: 90px;
    }
  </style>
</head>

<body class="d-flex flex-column min-vh-100">
  <!-- Navbar -->
  <div id="navbar-placeholder"></div>
  <script src="../js/navbar_loader.js"></script>

  <!-- Main Giriş Alanı -->
  <main class="flex-fill d-flex justify-content-center align-items-center my-5">
    <div class="login-container text-center col-md-8 col-lg-6 mt-0">
      <img src="../media/logo.png" alt="ClassConnect Logo" class="logo mb-3">
      <h4 class="mb-4 fw-semibold">Giriş Yap</h4>

      <form id="loginForm">
        <div class="mb-3 text-start">
          <label for="email" class="form-label">E-posta Adresi</label>
          <input type="email" class="form-control" id="email" required placeholder="example@domain.com">
        </div>
        <div class="mb-3 text-start">
          <label for="password" class="form-label">Şifre</label>
          <div class="input-group">
            <input type="password" class="form-control" id="password" required placeholder="Şifrenizi girin">
            <button id="togglePasswordBtn" class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility()">
              <i id="eyeIcon" class="bi bi-eye"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Giriş Yap</button>
        <div class="mt-3">
          <a href="forget_password.html" class="text-decoration-none">Şifremi Unuttum</a>
        </div>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer id="footer-placeholder" class="mt-auto">
    <script src="../js/footer_loader.js"></script>
  </footer>

  <!-- Inline JavaScript -->
  <script>
    // Şifre görünürlüğü değiştir
    function togglePasswordVisibility() {
        const passwordInput = document.getElementById('password');
        const toggleBtn = document.getElementById('togglePasswordBtn');
        const eyeIcon = document.getElementById('eyeIcon');

        const isVisible = passwordInput.type === 'text';
        passwordInput.type = isVisible ? 'password' : 'text';

        eyeIcon.className = isVisible ? 'bi bi-eye' : 'bi bi-eye-slash';
        toggleBtn.style.backgroundColor = isVisible ? '#f8f9fa' : '#9384e6';
        toggleBtn.style.color = isVisible ? '#000' : '#fff';
      }

    document.addEventListener('DOMContentLoaded', () => {
      const API_BASE = 'https://classconnect.com.tr';
      const form    = document.getElementById('loginForm');
      const emailIn = document.getElementById('email');
      const passIn  = document.getElementById('password');

      form.addEventListener('submit', async e => {
        e.preventDefault();

        const email    = emailIn.value.trim().toLowerCase();
        const password = passIn.value;
        if (!email || !password) {
          alert('Lütfen email ve şifre girin');
          return;
        }

        try {
          const res = await fetch(`${API_BASE}/api/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ email, password })
          });
          const data = await res.json();

          if (!res.ok) {
            alert(data.message || 'Hatalı giriş!');
            return;
          }

          // Başarılı → yönlendir
          if (data.success && data.redirect) {
            window.location.href = data.redirect;
          } else {
            alert('Giriş başarılı ama yönlendirme bilgisi alınamadı.');
          }
        } catch (err) {
          console.error('Fetch login error:', err);
          alert('Sunucu hatası oluştu');
        }
      });
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
